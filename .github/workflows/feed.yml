name: News feed

on:
  schedule:
    # Every 30 minutes. GitHub runs these late and sometimes skips them, so
    # treat the feed as "usually under an hour old" rather than exactly 30 min.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the feed
        run: python tools/build_feed.py

      - name: Publish
        run: |
          git config user.name  "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Feed unchanged - nothing to publish."
            exit 0
          fi
          git commit -m "Feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            echo "push rejected; rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push after 5 attempts"
          exit 1
