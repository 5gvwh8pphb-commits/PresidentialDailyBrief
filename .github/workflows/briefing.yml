name: Daily briefing

on:
  schedule:
    # 08:40 UTC = 3:40 AM Central Daylight Time.
    # Deliberately early and deliberately off the top of the hour.
    # GitHub's scheduled runs queue behind everyone else's; :00 slots are the
    # most contended and were arriving ~2 hours late. Starting at 3:40 means
    # even a two-hour delay still publishes before 6 AM Central.
    # Note: drifts an hour earlier when CST resumes in November.
    - cron: '40 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve today's Chicago date
        id: d
        run: |
          echo "date=$(TZ=America/Chicago date +%F)"                   >> "$GITHUB_OUTPUT"
          echo "label=$(TZ=America/Chicago date '+%A, %B %-d, %Y')"    >> "$GITHUB_OUTPUT"
          echo "short=$(TZ=America/Chicago date '+%a, %b %-d, %Y')"    >> "$GITHUB_OUTPUT"
          echo "dow=$(TZ=America/Chicago date '+%A')"                  >> "$GITHUB_OUTPUT"

      - name: Write the briefing
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep" --model claude-sonnet-5'
          prompt: |
            You are writing Jim Martin's Daily News Briefing into this repository.
            Today in America/Chicago is ${{ steps.d.outputs.dow }}, ${{ steps.d.outputs.date }}.

            YOUR ONLY JOB IS TO WRITE TWO FILES. Do not run git. Do not commit.
            A later step handles publishing.

            First read README.md. It defines the exact JSON schema. Follow it precisely.

            == RESEARCH ==
            Run a separate WebSearch for EACH beat below, in this fixed order.
            Verify recency and the spoiler window before including anything.

            1. Market recap (group: markets) - the most recent trading day the US market
               was open; skip weekends and holidays. TODAY IS ${{ steps.d.outputs.dow }} -
               if that is Monday, recap the previous full trading week rather than just Friday.
            2. US-related international news (group: security) - major world stories
               connected to or affecting the United States.
            3. China watch (group: security) - news bearing on potential future conflict
               with China: Taiwan Strait, South China Sea, US-China military posture,
               security-relevant trade and tech tension.
            4. Military news (group: security) - any active conflict or operation involving
               US troops, ships, aircraft, or space assets.
            5. Military technology (group: security) - new and upcoming capabilities and
               platforms, e.g. AI-enabled systems, F-47, B-21, naval ships, space assets.
            6. AI news (group: ai) - developments likely to affect Jim's life within the next
               12 months. Give special attention to Anthropic and Claude news.
            7. Chicago Bears (group: sports) - roster, injuries, front office, schedule.
            8. William Byron, NASCAR (group: sports) - driver news.
            9. PCA, Presbyterian Church in America (group: community) - denominational
               news relevant to a serving elder.

            DO NOT include school district news in this brief. It has its own dedicated
            weekly brief and duplicating it here is wrong.

            == HARD RULES ==
            - RECENCY, beats 1-6: past 24 hours strongly preferred, 72 hours absolute
              maximum. NEVER include anything older. If nothing qualifies, the beat is empty.
            - RECENCY, beats 7-9: past 24 hours preferred. If nothing new, fall back to
              48 hours; if still nothing, fall back to 72 hours. Nothing older than 72
              hours, EVER. There is no niche exception. If nothing qualifies, the beat
              is empty and says so.
            - DEDUP against prior briefs: before including any 48h or 72h item on beats
              7-9, Read the two or three most recent files in briefings/ (skip today's
              file if it exists) and confirm the item has NOT already been reported.
              If it has, treat it as already covered and either find a genuinely new
              item within the window or set the beat empty.
            - SPOILER RULE, beats 7 and 8 ONLY: never reveal scores, results, or game/race
              outcomes from the past 7 days, even if otherwise within the recency window.
              Roster moves, injury updates, schedule info, contracts and sponsorships are fine.
            - EMPTY IS A CORRECT ANSWER: if a beat has no qualifying news, set empty to true,
              headline "No fresh news on this beat right now", and say briefly in body why.
              NEVER manufacture filler or stretch to a loosely related story.
            - SOURCING, general: reputable or primary outlets only. No clickbait.
            - SOURCING, beat 7 (Chicago Bears): rumours are welcome, but ONLY from this
              allowlist: NFL.com, ESPN.com, Adam Schefter, Adam Hoge, Adam Jahns,
              Fox Sports, Chicago Sun-Times, Chicago Tribune, Brad Biggs, WSCR The Score,
              ESPN Radio, CHGO. If a rumour appears only in outlets outside that list, skip it.
              A confirmed transaction reported by any reputable outlet is fine; the
              allowlist governs rumour and speculation only.
            - TONE: report facts plainly. No ideological or partisan framing or commentary
              from any political direction.

            == BEAT 1 SPECIAL SHAPE ==
            The Market recap beat renders as a three-tile scorecard. Follow the
            "Beat 1: Market recap (special shape)" section in README.md exactly:
              - Set kicker to "Prior-day market scorecard" Tue-Fri, or
                "Weekly market scorecard" on Mondays.
              - subline: close date + a short characterisation.
              - indices: exactly three entries in order S&P 500, Dow, Nasdaq, each
                with close, change, changePct, sixMo (6-month % change). On Mondays
                the hero is the weekly percent - put it in "change" and set
                "heroLabel": "week" instead of changePct.
              - Omit "headline" on this beat when writing the scorecard shape.
              - Do NOT put the source string inside body; the shell appends it.
              - sixMo requires a separate lookup: for each index, get the closing
                value roughly six months before the recap's close date and compute
                the percent change to two significant figures. Verify with a
                WebSearch or WebFetch; do not estimate.

            == FILE 1 ==
            Write briefings/${{ steps.d.outputs.date }}.json matching README.md exactly.
            All nine beats present, in order, n = 1 through 9. headline is one sentence-case
            line. body is one or two sentences of real substance. age is a short relative
            label such as "~4h ago". url is the single best source link, or null when empty.
            Set:
              "date":      "${{ steps.d.outputs.date }}"
              "dateLabel": "${{ steps.d.outputs.label }}"
              "slot":      "by 6 AM CT"
              "window":    "past 24h"
              "generated": the current UTC timestamp
            Overwrite the file if it already exists.

            == FILE 2 ==
            Edit briefings/index.json: set "latest" to "${{ steps.d.outputs.date }}" and
            prepend {"date": "${{ steps.d.outputs.date }}", "label": "${{ steps.d.outputs.short }}"}
            to the archive array, newest first. Do not duplicate a date already present.
            Keep at most 60 archive entries.

            Finish by stating how many beats came back empty and why.

      - name: Publish
        id: pub
        run: |
          git config user.name  "briefing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish - the briefing step wrote nothing."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git commit -m "Briefing ${{ steps.d.outputs.date }}"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected; rebasing onto origin/main (attempt $i)"
            git pull --rebase --autostash origin main || exit 1
            sleep 5
          done
          echo "could not push after 5 attempts"
          exit 1

      - name: Confirm it is live
        run: |
          echo "Published briefing ${{ steps.d.outputs.date }}"
          git log -1 --oneline
