<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feed</title>
<meta name="description" content="Live news feed across Jim's interests.">
<meta name="theme-color" content="#10141A">
<meta name="apple-mobile-web-app-title" content="Feed">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2310141A'/><rect x='6' y='7' width='20' height='8' rx='1.5' fill='%23F0A32E'/><rect x='6' y='18' width='12' height='3' rx='1.5' fill='%238A96A6'/><rect x='6' y='23' width='17' height='3' rx='1.5' fill='%238A96A6'/></svg>">
<style>
  :root {
    color-scheme: dark;
    --ground:#10141A; --surface:#171D26; --surface-2:#1E2631;
    --line:#2B3542; --ink:#E8ECF2; --ink-muted:#97A4B4; --ink-faint:#6E7C8C;
    --accent:#F0A32E;
    --world:#F0A32E; --markets:#4E9AE8; --defense:#E8703F;
    --ai:#8F87E6; --local:#8FBF3F; --bears:#35B98C; --nascar:#E87A9A;
    --mono: ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
    --sans: "Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0 auto; max-width:720px; background:var(--ground); color:var(--ink);
    font-family:var(--sans); line-height:1.5;
    padding:20px 16px calc(48px + env(safe-area-inset-bottom));
  }

  /* Masthead geometry is shared byte-for-byte with skynet/index.html.
     Do not tune these numbers on one page — the wordmark must not shift
     by a single pixel when Jim moves between pages. That is also why the
     Refresh button sits on the subline and not beside the wordmark: a
     40px control in a baseline-aligned row drags the wordmark down. */
  .masthead {
    display:flex; flex-direction:column; gap:11px;
    position:sticky; top:0; z-index:20; background:var(--ground);
    margin:-20px 0 12px; padding:20px 0 10px;
  }
  .brandline { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  h1 { font-family:var(--mono); font-size:25px; font-weight:700; margin:0;
       letter-spacing:.21em; text-transform:uppercase;
       color:var(--ink); text-decoration:none; }
  h1 .dot { color:var(--accent); }
  h1 a { color:inherit; text-decoration:none; }
  h1 a:active { color:var(--accent); }
  .rule { height:3px; border-radius:2px;
          background:linear-gradient(to right,var(--accent) 0 62px,var(--line) 62px 100%); }
  .subline { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .sublabel { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .pagename { font-family:var(--mono); font-size:10.5px; text-transform:uppercase;
              letter-spacing:.15em; color:var(--ink-muted); margin:0; }
  .meta { font-family:var(--mono); font-size:11px; color:var(--ink-faint); letter-spacing:.05em; }

  .refresh {
    -webkit-appearance:none; appearance:none; cursor:pointer;
    background:var(--surface); color:var(--ink-muted); border:1px solid var(--line);
    border-radius:8px; font-family:var(--mono); font-size:10.5px; letter-spacing:.09em;
    text-transform:uppercase; display:inline-flex; align-items:center; gap:7px;
    padding:0 12px; min-height:40px; flex-shrink:0;
  }
  .refresh:active { color:var(--accent); border-color:var(--accent); }
  .refresh svg { display:block; }
  .refresh.spin svg { animation:sp .7s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }

  .chips { display:flex; gap:6px; overflow-x:auto; padding:2px 0 12px;
           -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip {
    -webkit-appearance:none; appearance:none; cursor:pointer; white-space:nowrap;
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    background:var(--surface); color:var(--ink-muted); border:1px solid var(--line);
    border-radius:999px; padding:0 13px; min-height:36px; flex-shrink:0;
  }
  .chip[aria-pressed="true"] { background:var(--accent); color:#17130A; border-color:var(--accent); font-weight:700; }

  .grid { display:grid; grid-template-columns:1fr; gap:12px; }
  @media (min-width:640px) { .grid { grid-template-columns:1fr 1fr; } }

  .card {
    display:flex; flex-direction:column; text-decoration:none; color:inherit;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    overflow:hidden;
  }
  .card:active { border-color:var(--ink-faint); }
  .card:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .shot { position:relative; width:100%; aspect-ratio:16/9; background:var(--surface-2); overflow:hidden; }
  .shot img { width:100%; height:100%; object-fit:cover; display:block; }
  .shot .fallback {
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink-faint); background:var(--surface-2);
  }
  .shot.broken img { display:none; }
  .shot.broken .fallback { display:flex; }

  .body { padding:11px 13px 13px; display:flex; flex-direction:column; gap:6px; }
  .kicker { display:flex; align-items:center; gap:8px; font-family:var(--mono);
            font-size:10px; letter-spacing:.09em; text-transform:uppercase; }
  .kicker .src { color:var(--tc,var(--ink-muted)); font-weight:700; }
  .kicker .age { color:var(--ink-faint); margin-left:auto; white-space:nowrap; }
  .dotmark { width:7px; height:7px; border-radius:50%; background:var(--tc,var(--ink-faint)); flex-shrink:0; }
  .title { font-size:15.5px; font-weight:650; line-height:1.32; margin:0; text-wrap:balance; }
  .sum { font-size:13px; color:var(--ink-muted); line-height:1.5; margin:0; }

  .lead { grid-column:1/-1; }
  .lead .shot { aspect-ratio:16/8; }
  .lead .title { font-size:20px; }

  .state { padding:40px 16px; text-align:center; color:var(--ink-muted); grid-column:1/-1; }
  .state .mark { display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.16em;
                 color:var(--accent); border:1px dashed var(--accent); border-radius:5px;
                 padding:7px 12px; margin-bottom:12px; }
  .state p { margin:0 auto; font-size:14px; max-width:44ch; line-height:1.6; }

  .foot { margin-top:22px; padding-top:13px; border-top:1px solid var(--line);
          font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); line-height:1.7; }
  .foot a { color:var(--accent); text-decoration:none; }
  @media (prefers-reduced-motion: reduce) { .refresh.spin svg { animation:none; } }
  @media (min-width:620px) {
    body { padding:32px 24px calc(64px + env(safe-area-inset-bottom)); }
    .masthead { margin:-32px 0 12px; padding:32px 0 10px; }
    h1 { font-size:31px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="brandline">
    <h1><a href="../skynet/" aria-label="Back to Skynet console">Skynet<span class="dot">.</span></a></h1>
  </div>
  <div class="rule"></div>
  <div class="subline">
    <div class="sublabel">
      <p class="pagename">Feed</p>
      <div class="meta" id="meta">Loading&hellip;</div>
    </div>
    <button class="refresh" id="refresh" type="button" aria-label="Refresh">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
        <path d="M20 11a8 8 0 1 0-2.3 5.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Refresh</span>
    </button>
  </div>
</header>

<div class="chips" id="chips"></div>

<main class="grid" id="out">
  <div class="state"><span class="mark">LOADING</span><p>Pulling the latest headlines.</p></div>
</main>

<footer class="foot">
  Headlines and images belong to their publishers &middot; tap to read the original.
  <div style="padding-top:6px"><a href="../skynet/">&larr; Skynet console</a></div>
</footer>

<script>
(function () {
  var out = document.getElementById('out');
  var meta = document.getElementById('meta');
  var chips = document.getElementById('chips');
  var TOPICS = [
    ['all', 'All'], ['world', 'World'], ['markets', 'Markets'],
    ['defense', 'Defense'], ['ai', 'AI & tech'], ['local', 'NW Indiana'],
    ['bears', 'Bears'], ['nascar', 'Byron']
  ];
  var data = null, filter = 'all';

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function state(mark, msg) {
    out.innerHTML = '<div class="state"><span class="mark">' + esc(mark) +
                    '</span><p>' + esc(msg) + '</p></div>';
  }

  function card(it, lead) {
    var tc = 'var(--' + (it.topic || 'world') + ')';
    var img = it.image
      ? '<img src="' + esc(it.image) + '" alt="" loading="lazy" referrerpolicy="no-referrer" ' +
        'onerror="this.parentNode.classList.add(\'broken\')">'
      : '';
    return '<a class="card' + (lead ? ' lead' : '') + '" style="--tc:' + tc + '" href="' +
      esc(it.url) + '" target="_blank" rel="noopener noreferrer">' +
      '<div class="shot' + (it.image ? '' : ' broken') + '">' + img +
        '<span class="fallback">' + esc(it.source) + '</span></div>' +
      '<div class="body">' +
        '<div class="kicker"><span class="dotmark"></span>' +
          '<span class="src">' + esc(it.source) + '</span>' +
          '<span class="age">' + esc(it.age) + '</span></div>' +
        '<p class="title">' + esc(it.title) + '</p>' +
        (lead && it.summary ? '<p class="sum">' + esc(it.summary) + '</p>' : '') +
      '</div></a>';
  }

  function draw() {
    if (!data) return;
    var items = data.items || [];
    if (filter !== 'all') items = items.filter(function (i) { return i.topic === filter; });
    if (!items.length) {
      state('NOTHING HERE', 'No stories under that filter right now. Try All.');
      return;
    }
    out.innerHTML = items.map(function (it, n) { return card(it, n === 0); }).join('');
  }

  function drawChips() {
    var present = {};
    (data.items || []).forEach(function (i) { present[i.topic] = 1; });
    chips.innerHTML = TOPICS.filter(function (t) {
      return t[0] === 'all' || present[t[0]];
    }).map(function (t) {
      return '<button class="chip" type="button" data-t="' + t[0] + '" aria-pressed="' +
             (t[0] === filter) + '">' + t[1] + '</button>';
    }).join('');
  }

  chips.addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    filter = b.getAttribute('data-t');
    Array.prototype.forEach.call(chips.children, function (c) {
      c.setAttribute('aria-pressed', c === b);
    });
    draw();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  function boot() {
    return fetch('latest.json?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        data = d;
        var when = new Date(d.generated);
        var mins = Math.max(0, Math.round((Date.now() - when.getTime()) / 60000));
        var fresh = mins < 1 ? 'just now' : (mins < 60 ? mins + 'm ago' :
                    Math.round(mins / 60) + 'h ago');
        meta.textContent = d.count + ' stories · updated ' + fresh +
                           (d.bearsDay ? ' · Bears included today' : '');
        drawChips();
        draw();
      })
      .catch(function () {
        state('UNAVAILABLE', 'Could not load the feed. It may not have been built yet.');
        meta.textContent = '—';
      });
  }

  boot();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) boot(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) boot(); });

  var rb = document.getElementById('refresh');
  rb.addEventListener('click', function () {
    rb.classList.add('spin');
    boot().then(function () { setTimeout(function () { rb.classList.remove('spin'); }, 400); });
  });
})();
</script>
</body>
</html>
